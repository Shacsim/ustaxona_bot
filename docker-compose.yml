services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ustaxona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ustaxona}
      POSTGRES_DB: ${POSTGRES_DB:-ustaxona}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ustaxona} -d ${POSTGRES_DB:-ustaxona}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Docker ichida host nomi 'db' bo'ladi — .env dagi localhost'ni bosib o'tadi
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ustaxona}:${POSTGRES_PASSWORD:-ustaxona}@db:5432/${POSTGRES_DB:-ustaxona}
    # Mini App veb-serveri — faqat lokal, tashqariga nginx (shacsimdev.uz/ustaxona/) orqali
    ports:
      - "127.0.0.1:${WEB_PUBLIC_PORT:-3040}:8080"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python main.py"

  # Kunlik avtomatik zaxira: har 24 soatda pg_dump (gzip), 14 kun saqlanadi.
  # Nusxalar serverdagi ./backups papkasiga tushadi.
  db_backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-ustaxona}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ustaxona}
      PGDATABASE: ${POSTGRES_DB:-ustaxona}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -u
        mkdir -p /backups
        echo "[backup] xizmat ishga tushdi — har 24 soatda zaxira"
        while true; do
          ts=$$(date +%Y%m%d_%H%M%S)
          out="/backups/ustaxona_$${ts}.sql.gz"
          echo "[backup] $${ts} boshlandi"
          if pg_dump --clean --if-exists | gzip > "$${out}.tmp"; then
            mv "$${out}.tmp" "$${out}"
            echo "[backup] saqlandi: $${out} ($$(du -h "$${out}" | cut -f1))"
          else
            echo "[backup] XATO — zaxira olinmadi"
            rm -f "$${out}.tmp"
          fi
          # Eski nusxalarni tozalash (BACKUP_KEEP_DAYS kundan eskisi)
          find /backups -name 'ustaxona_*.sql.gz' -type f -mtime +$${BACKUP_KEEP_DAYS} -delete 2>/dev/null || true
          sleep 86400
        done

volumes:
  pgdata:
