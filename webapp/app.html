<style>
  :root {

    --line: color-mix(in srgb, var(--hint) 22%, transparent);

    --r: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: 84px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px 8px; display: flex; align-items: center; gap: 10px; }
  header .t { flex: 1; min-width: 0; }
  header h1 { font-size: 20px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header small { color: var(--hint); font-size: 12px; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--soft); color: var(--accent); font-weight: 700; cursor: pointer; }

  main { padding: 0 12px; }
  .card { background: var(--card); border-radius: var(--r); padding: 14px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 10px; font-size: 15px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .muted { color: var(--hint); font-size: 13px; }
  .grow { flex: 1; min-width: 0; }

  .seg { display: flex; background: var(--card); border-radius: 12px; padding: 3px; margin-bottom: 10px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--hint); cursor: pointer; }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; scrollbar-width: none; }
  .chips button { border: 1px solid var(--line); background: var(--card); padding: 6px 12px; border-radius: 999px; white-space: nowrap; font-size: 13px; cursor: pointer; }
  .chips button.on { border-color: var(--accent); color: var(--accent); background: var(--soft); font-weight: 600; }

  .item { background: var(--card); border-radius: var(--r); padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
  .item .top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .num { font-weight: 800; font-size: 16px; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--accent); white-space: nowrap; }
  .badge.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
  .badge.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .badge.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
  .item .desc { white-space: pre-line; overflow-wrap: anywhere; }
  .price { font-weight: 700; white-space: nowrap; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .stat { background: var(--card); border-radius: var(--r); padding: 12px; }
  .stat b { display: block; font-size: 18px; margin-top: 2px; overflow-wrap: anywhere; }
  .stat span { color: var(--hint); font-size: 12px; }

  label.f { display: block; font-size: 13px; color: var(--hint); margin: 12px 2px 6px; }
  .input { width: 100%; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; outline: 0; font-size: 16px; }
  .input:focus { border-color: var(--accent); }
  .input.big { font-size: 22px; font-weight: 700; letter-spacing: .4px; }
  textarea.input { min-height: 90px; resize: vertical; }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px; font-weight: 700; font-size: 15px; background: var(--accent); color: var(--accent-text); cursor: pointer; margin-top: 14px; }
  .btn.ghost { background: var(--soft); color: var(--accent); }
  .btn.danger { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
  .btn:disabled { opacity: .5; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btns .btn { margin-top: 0; }
  .phone { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 0 14px; }
  .phone:focus-within { border-color: var(--accent); }
  .phone .pre { font-size: 22px; font-weight: 700; white-space: nowrap; }
  .phone input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 12px 0; font-size: 22px; font-weight: 700; letter-spacing: .4px; }
  .suggest { display: inline-block; margin-top: 8px; border: 0; background: var(--soft); color: var(--accent); padding: 8px 12px; border-radius: 10px; font-weight: 600; cursor: pointer; }
  .total { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--soft); font-weight: 600; }

  .list-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list-row:last-child { border-bottom: 0; }
  .empty { text-align: center; color: var(--hint); padding: 30px 10px; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line); display: flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  nav button { flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--hint); padding: 4px 0; cursor: pointer; }

  .sheet { width: 100%; max-height: 92vh; overflow-y: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding: 8px 14px calc(18px + env(safe-area-inset-bottom)); animation: up .18s ease-out; }

  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
  .kv span { color: var(--hint); }

/* ---------------- yordamchilar ---------------- */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function strip(s) { return String(s || "").replace(/<[^>]+>/g, ""); }
function money(v) { return (v == null ? "—" : String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " " + CUR[lang]); }
function tz(d) { return new Date(d); }
function fdt(iso) {
  if (!iso) return "—";
  return tz(iso).toLocaleString("ru-RU", { timeZone: "Asia/Tashkent", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}
function daysAgo(iso) {
  var f = function (d) { return d.toLocaleDateString("en-CA", { timeZone: "Asia/Tashkent" }); };
  var a = new Date(f(new Date())), b = new Date(f(tz(iso)));
  var n = Math.round((a - b) / 86400000);
  return n <= 0 ? L.todayW : n === 1 ? L.yesterday : n + " " + L.days;
}
function digits(v) { return String(v || "").replace(/\D/g, ""); }
function haptic(kind) { try { tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} }
function tap() { try { tg.HapticFeedback.impactOccurred("light"); } catch (e) {} }

var toastTimer;
function toast(msg, ok) {
  var el = $("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; document.body.appendChild(el); }
  el.textContent = strip(msg);
  el.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.add("hidden"); }, 2800);
  if (ok !== undefined) haptic(ok ? "success" : "error");
}
function confirmBox(text) {
  return new Promise(function (res) {
    if (tg && tg.showConfirm && tg.initData) tg.showConfirm(text, res); else res(window.confirm(text));
  });
}

function api(method, path, body) {
  var opts = { method: method, headers: { "X-Telegram-Init-Data": (tg && tg.initData) || "" } };
  if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  return fetch(BASE + "/api" + path, opts).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) { var e = new Error(j.message || j.error || ("HTTP " + r.status)); e.code = j.error; e.status = r.status; throw e; }
      return j;
    });
  });
}
function fail(e) { toast(e.message || "Error", false); }

/* Tugmani so'rov davomida bloklash */
function busy(btn, promise) {
  btn.disabled = true;
  return promise.finally(function () { btn.disabled = false; });
}

  bg.addEventListener("click", function (e) { if (e.target === bg) closeSheet(); });
  $("sheetRoot").appendChild(bg);
  sheetStack++;
  if (tg && tg.BackButton) tg.BackButton.show();
  if (onMount) onMount(bg.querySelector(".sheet"));
  return bg;
}
function closeSheet() {
  var root = $("sheetRoot");
  if (root.lastChild) { root.removeChild(root.lastChild); sheetStack--; }
  if (sheetStack <= 0 && tg && tg.BackButton) tg.BackButton.hide();
}

function orderMatches(o, q) {
  if (!q) return true;
  q = q.toLowerCase().trim();
  var dq = digits(q);
  return String(o.number) === q.replace("#", "") ||
    (o.customer_name || "").toLowerCase().indexOf(q) >= 0 ||
    (o.description || "").toLowerCase().indexOf(q) >= 0 ||
    (dq.length >= 3 && digits(o.customer_phone).indexOf(dq) >= 0);
}

    '</button><button type="button" data-seg="ready" class="' + (S.ordersSeg === "ready" ? "on" : "") + '">✅ ' + L.ready + "</button></div>";

/* ================= YANGI BUYURTMA ================= */
/* Telefon: "+998" o'zgarmas prefiks, maydonga 9 ta mahalliy raqam yoziladi.
   Xorijiy raqam: maydonni "+" bilan boshlash (prefiks yashirinadi). */
function fmtPhone(v) {
  v = String(v || "");
  var d = digits(v);
  if (v.trim().charAt(0) === "+") {
    if (d.indexOf("998") === 0) d = d.slice(3); else return "+" + d.slice(0, 15);
  }
  if (d.length > 9 && d.indexOf("998") === 0) d = d.slice(3);
  d = d.slice(0, 9);
  var out = d.slice(0, 2);
  if (d.length > 2) out += " " + d.slice(2, 5);
  if (d.length > 5) out += " " + d.slice(5, 7);
  if (d.length > 7) out += " " + d.slice(7, 9);
  return out;
}
function phoneFull(v) {
  v = String(v || "").trim();
  return v.charAt(0) === "+" ? "+" + digits(v) : "+998" + digits(v);
}
function phoneOk(v) {
  v = String(v || "").trim();
  var d = digits(v);
  return v.charAt(0) === "+" ? d.length >= 7 && d.length <= 15 : d.length === 9;
}

function stat(label, value) { return '<div class="stat"><span>' + esc(label) + "</span><b>" + esc(value) + "</b></div>"; }

function moveSheet(kind) {
  var prods = S.inv.products.filter(function (p) { return kind === "buy" || p.quantity > 0; });
  var productField = kind === "buy"
    ? '<input class="input" id="mname" list="mlist" autocomplete="off" placeholder="' + esc(L.productPh) + '"><datalist id="mlist">' +
      prods.map(function (p) { return '<option value="' + esc(p.name) + '">'; }).join("") + "</datalist><div class=\"muted\" id=\"minfo\" style=\"margin:6px 2px 0\"></div>"
    : '<select class="input" id="mprod"><option value="">' + esc(L.choose) + "</option>" +
      prods.map(function (p) { return '<option value="' + p.id + '">' + esc(p.name) + " · " + p.quantity + " " + L.pcs + "</option>"; }).join("") + "</select>";
  var html = '<div class="card"><label class="f" style="margin-top:0">' + L.product + "</label>" + productField +
    '<label class="f">' + L.qty + '</label><input class="input big" id="mqty" inputmode="numeric" value="1">' +
    '<label class="f">' + (kind === "buy" ? L.unitBuy : L.unitSell) + '</label><input class="input big" id="mprice" inputmode="numeric" placeholder="' + esc(L.pricePh) + '">' +
    '<div class="total" id="mtotal">' + L.total + ": —</div>" +
    '<button class="btn" id="mgo" type="button">' + L.save + "</button></div>";
  openSheet(kind === "buy" ? L.bought : L.sold, html, function (sh) {
    var q = sh.querySelector("#mqty"), pr = sh.querySelector("#mprice");
    function product() {
      if (kind === "sell") { var id = +sh.querySelector("#mprod").value; return prods.filter(function (p) { return p.id === id; })[0]; }
      var n = sh.querySelector("#mname").value.trim().toLowerCase().replace(/\s+/g, " ");
      return prods.filter(function (p) { return p.name.toLowerCase().replace(/\s+/g, " ") === n; })[0];
    }
    function recalc() {
      var qty = +digits(q.value) || 0, price = +digits(pr.value) || 0, p = product();
      var txt = L.total + ": " + money(qty * price);
      if (kind === "sell" && p) txt += " · " + L.estProfit + ": " + money((price - p.avg_cost) * qty);
      sh.querySelector("#mtotal").textContent = txt;
      if (kind === "buy") {
        var nm = sh.querySelector("#mname").value.trim();
        sh.querySelector("#minfo").textContent = p ? "📦 " + L.inStock + ": " + p.quantity + " " + L.pcs : nm ? "➕ " + L.newProduct : "";
      }
    }
    pr.oninput = function () { var d = digits(pr.value); pr.value = d ? money(+d).replace(" " + CUR[lang], "") : ""; recalc(); };
    q.oninput = function () { q.value = digits(q.value); recalc(); };
    var sel = sh.querySelector(kind === "buy" ? "#mname" : "#mprod");
    sel.oninput = sel.onchange = function () {
      var p = product();
      if (kind === "sell" && p && !pr.value && p.avg_cost) pr.value = money(p.avg_cost).replace(" " + CUR[lang], "");
      recalc();
    };
    setTimeout(function () { sel.focus(); }, 150);
    sh.querySelector("#mgo").onclick = function () {
      var p = product(), body = { qty: digits(q.value), price: digits(pr.value) };
      if (kind === "buy") { if (p) body.product_id = p.id; else body.name = sh.querySelector("#mname").value; }
      else body.product_id = p ? p.id : 0;
      busy(this, api("POST", "/inventory/" + kind, body).then(function (j) {
        closeSheet();
        toast((kind === "buy" ? L.savedIn : L.savedOut) + ": " + j.product.name + " × " + j.move.quantity + " · " + L.inStock + " " + j.product.quantity, true);
        viewStock();
      }).catch(fail));
    };
  });
}

      '<button class="btn" id="bcgo" type="button">' + L.send + "</button></div>" +
      '<button class="btn ghost" id="bk" type="button">' + L.backup + "</button>");
    document.querySelectorAll("[data-ap]").forEach(function (b) { b.onclick = function () { tap(); S.adminPeriod = b.dataset.ap; viewAdmin(); }; });
    var target = "masters";
    document.querySelectorAll("[data-bt]").forEach(function (b) {
      b.onclick = function () { tap(); target = b.dataset.bt; document.querySelectorAll("[data-bt]").forEach(function (x) { x.classList.toggle("on", x === b); }); };
    });
    $("bcgo").onclick = function () {
      var text = $("bctext").value.trim(), btn = this;
      if (text.length < 2) { $("bctext").focus(); return; }
      confirmBox(L.broadcast + " → " + (target === "group" ? L.toGroup : L.toMasters) + "?").then(function (yes) {
        if (!yes) return;
        busy(btn, api("POST", "/admin/broadcast", { target: target, text: text }).then(function (j) {
          $("bctext").value = "";
          toast(L.bcSent + (target === "masters" ? " (" + j.sent + ")" : ""), true);
        }).catch(fail));
      });
    };
    $("bk").onclick = function () { busy(this, api("POST", "/admin/backup", {}).then(function () { toast(L.backupSent, true); }).catch(fail)); };
    document.querySelectorAll("[data-act]").forEach(function (b) {
      b.onclick = function () {
        var act = b.dataset.act;
        (act === "delete" ? confirmBox(L.confirmDel) : Promise.resolve(true)).then(function (yes) {
          if (!yes) return;
          busy(b, api("POST", "/admin/masters/" + b.dataset.id, { action: act }).then(function () { haptic("success"); viewAdmin(); }).catch(fail));
        });
      };
    });
  }).catch(function (e) { setMain('<div class="empty">' + esc(strip(e.message)) + "</div>"); });
}

/* ================= PROFIL / TIL ================= */
function openProfile() {
  var u = S.me.user;
  openSheet(L.profile, '<div class="card"><div class="kv"><span>👤</span><b>' + esc(u.name) + "</b><span>" + L.role + "</span><div>" +
    (u.is_admin ? "👑 " + L.adminRole : "🔧 " + L.master) + "</div><span>ID</span><div>" + u.telegram_id + "</div></div></div>" +
    '<div class="card"><h3>🌐 ' + L.language + '</h3><div class="seg" style="background:var(--bg);margin:0">' +
    [["uz", "🇺🇿 O'zbekcha"], ["ru", "🇷🇺 Русский"], ["en", "🇬🇧 English"]].map(function (x) {
      return '<button type="button" data-lang="' + x[0] + '" class="' + (lang === x[0] ? "on" : "") + '">' + x[1] + "</button>";
    }).join("") + "</div></div>", function (sh) {
    sh.querySelectorAll("[data-lang]").forEach(function (b) {
      b.onclick = function () {
        tap();
        api("POST", "/lang", { lang: b.dataset.lang }).then(function () {
          S.me.user.language = b.dataset.lang;
          applyLang(b.dataset.lang);
          closeSheet();
          go(S.tab);
        }).catch(fail);
      };
    });
  });
}

function applyLang(l) {
  lang = I[l] ? l : "uz";
  L = I[lang];
  document.documentElement.lang = lang;
  var u = S.me.user;
  $("hTitle").textContent = S.me.workshop || "Ustaxona";
  $("hSub").textContent = L.hello + ", " + u.name + (u.is_admin ? " · 👑" : "");
  $("avatar").textContent = (u.name || "?").trim().charAt(0).toUpperCase();
}

/* ================= ishga tushirish ================= */
function fatal(msg, retry) {
  setMain('<div class="center"><div style="font-size:48px">🔒</div><p>' + esc(strip(msg)) + "</p>" +
    (retry ? '<button class="btn" id="retry" type="button" style="max-width:240px">' + L.retry + "</button>" : "") + "</div>");
  if (retry) $("retry").onclick = boot;
}

function boot() {
  var guess = ((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || "uz").slice(0, 2);
  L = I[guess] || I.uz; lang = I[guess] ? guess : "uz";
  if (!tg || !tg.initData) { fatal(L.openTg, false); return; }
  loading();
  api("GET", "/me").then(function (j) {
    S.me = j;
    applyLang(j.user.language);
    $("hdr").classList.remove("hidden");
    $("nav").classList.remove("hidden");
    $("avatar").onclick = function () { tap(); openProfile(); };
    go(S.tab);
  }).catch(function (e) {
    if (e.code === "not_registered") fatal(L.notReg, false);
    else fatal(e.message, true);
  });
}

if (tg) {
  tg.ready();
  tg.expand();
  try { tg.disableVerticalSwipes(); } catch (e) {}
  if (tg.BackButton) tg.BackButton.onClick(closeSheet);
}
boot();
})();
</script>
</body>
</html>
